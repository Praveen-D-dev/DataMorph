version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datamorph_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datamorph_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datamorph_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-datamorph}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datamorph_user -d datamorph"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
